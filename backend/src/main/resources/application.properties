spring.application.name=trustdoc
server.port=8080

# --- Base de données : H2 en fichier (aucune installation). Voir application-postgres.properties pour PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/trustdoc;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Stockage des fichiers PDF importés (l'empreinte SHA-256 est recalculée à partir de ces fichiers)
trustdoc.storage.dir=./data/files
trustdoc.demo.load=true

# --- Sécurité : changez ce secret en production (au moins 32 caractères) ou utilisez la variable TRUSTDOC_JWT_SECRET
trustdoc.jwt.secret=${TRUSTDOC_JWT_SECRET:change-me-trustdoc-demo-secret-0123456789}
trustdoc.jwt.ttl-minutes=120

# --- Recherche
trustdoc.search.top-k=4
# Part minimale des mots-clés de la question présents dans le meilleur passage pour accepter de répondre
# (sinon : « je ne trouve pas cette information »)
trustdoc.search.min-coverage=0.5

# --- Modèle de langage : ollama (local, par défaut) | openai (API compatible OpenAI : OpenAI, Groq, Mistral...) | extractif (sans LLM)
trustdoc.llm.mode=${TRUSTDOC_LLM_MODE:ollama}
trustdoc.llm.timeout-seconds=120
trustdoc.llm.ollama.url=${OLLAMA_URL:http://localhost:11434}
trustdoc.llm.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
trustdoc.llm.openai.url=${OPENAI_BASE_URL:https://api.openai.com/v1}
trustdoc.llm.openai.model=${OPENAI_MODEL:gpt-4o-mini}
trustdoc.llm.openai.api-key=${OPENAI_API_KEY:}

# --- Vérification automatique de l'intégrité (toutes les 10 minutes)
trustdoc.integrity.cron=0 */10 * * * *
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
